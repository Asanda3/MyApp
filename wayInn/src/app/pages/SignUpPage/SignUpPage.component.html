<div class="h-screen bg-cover bg-center flex justify-center items-center">
  <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" class="max-w-sm">
    <div class="bg-white px-10 py-8 rounded-xl shadow-md">
       <!-- Avatar Container -->
      <div class="avatar-container mb-4 flex justify-center">
        <div class="w-24 rounded-full overflow-hidden">
          <img src="https://app-cdn.acelitchi.com/prod/app/2022/12/16/wwUxCLTSynu0Zja.webp" alt="User Avatar" class="object-cover w-full h-full"/>
        </div>
      </div>
      <img class="h-14 mb-4 mx-auto" src="https://www.synointcdn.com/wp-content/uploads/2019/04/Amazon-Logo-PNG.png" alt="">
      <div class="space-y-4">
        <h1 class="text-center text-2xl font-semibold text-gray-600">Sign Up</h1>
        <div>
          <label for="email" class="block mb-1 text-gray-600 font-semibold">Username</label>
          <input type="text" id="email" formControlName="email" class="bg-indigo-50 px-4 py-2 outline-none rounded-md w-full" />
          <div *ngIf="signUpForm.get('email')?.invalid && signUpForm.get('email')?.touched" class="text-red-500 text-sm">Valid email is required.</div>
        </div>
        <div>
          <label for="email" class="block mb-1 text-gray-600 font-semibold">Email</label>
          <input type="text" id="email" formControlName="email" class="bg-indigo-50 px-4 py-2 outline-none rounded-md w-full" />
          <div *ngIf="signUpForm.get('email')?.invalid && signUpForm.get('email')?.touched" class="text-red-500 text-sm">Valid email is required.</div>
        </div>
        <div>
          <label for="password" class="block mb-1 text-gray-600 font-semibold">Password</label>
          <input type="password" id="password" formControlName="password" class="bg-indigo-50 px-4 py-2 outline-none rounded-md w-full" />
          <div *ngIf="signUpForm.get('password')?.invalid && signUpForm.get('password')?.touched" class="text-red-500 text-sm">Password is required and must be at least 6 characters long.</div>
        </div>
        <div>
          <label for="confirmPassword" class="block mb-1 text-gray-600 font-semibold">Confirm Password</label>
          <input type="password" id="confirmPassword" formControlName="confirmPassword" class="bg-indigo-50 px-4 py-2 outline-none rounded-md w-full" />
          <div *ngIf="signUpForm.errors?.['mismatch'] && (signUpForm.get('confirmPassword')?.touched || signUpForm.get('password')?.touched)" class="text-red-500 text-sm">Passwords must match.</div>
        </div>
        <button type="submit" class="mt-4 bg-yellow-500 font-semibold py-2 rounded-md w-full">
          Sign Up
        </button>
        
        <p class="mt-4 text-sm text-center text-gray-400">
          Already have an account? 
          <a  class="text-indigo-400 focus:outline-none focus:underline focus:text-indigo-500 dark:focus:border-indigo-800" routerLink="/singin">
            Login
          </a>
        </p>
        
      </div>
    </div>
  </form>
</div>
