<div class="h-screen bg-cover bg-center flex justify-center items-center">
  <form class="max-w-sm">
    <div class="bg-white px-10 py-8 rounded-xl shadow-md">
      <img class="h-14 mb-4 mx-auto" src="https://www.synointcdn.com/wp-content/uploads/2019/04/Amazon-Logo-PNG.png" alt="">
      <div class="space-y-4">
        <h1 class="text-center text-2xl font-semibold text-gray-600">Sign In</h1>
        <div>
          <label for="username" class="block mb-1 text-gray-600 font-semibold">Username</label>
          <input type="text" id="username" class="bg-indigo-50 px-4 py-2 outline-none rounded-md w-full" />
        </div>
        <div>
          <label for="email" class="block mb-1 text-gray-600 font-semibold">Email</label>
          <input type="text" id="email" class="bg-indigo-50 px-4 py-2 outline-none rounded-md w-full" />
        </div>
        <div>
          <label for="password" class="block mb-1 text-gray-600 font-semibold">Password</label>
          <input type="password" id="password" class="bg-indigo-50 px-4 py-2 outline-none rounded-md w-full" />
        </div>
        <button type="button" [routerLink]="'/homepage'" class="mt-4 bg-yellow-500 font-semibold py-2 rounded-md w-full">
          Sign In
        </button>
        
        <p class="mt-4 text-sm text-center text-gray-400">
          Don't have an account? 
          <a [routerLink]="'/signUpPage'" class="text-indigo-400 focus:outline-none focus:underline focus:text-indigo-500 dark:focus:border-indigo-800">
            Sign Up
          </a>.
        </p>
      </div>
    </div>
  </form>
</div>
